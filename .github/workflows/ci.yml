name: Verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog python3 verilator yosys

      - name: Functional verification
        run: |
          make clean
          make test-all

      - name: RTL lint
        run: make lint

      - name: Generic synthesis check
        run: make synth-check
